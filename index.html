<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Quiz Anti-golpe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-container">
    
    <div class="chat-header">
        <div class="header-left">
            <i class="fa-solid fa-arrow-left back-arrow"></i>
            <img id="var-foto" src="" alt="Avatar" class="profile-pic">
            <div class="chat-details">
                <span id="var-nome" class="chat-title"></span>
                <span id="var-numero" class="chat-subtitle"></span>
            </div>
        </div>
        <div class="header-actions">
            <i class="fa-solid fa-video"></i>
            <i class="fa-solid fa-phone"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </div>

    <div class="chat-messages">
        <div id="var-dia" class="date-divider"></div>

        <div class="message-row">
            <div class="message-bubble">
                <span id="var-conteudo"></span>
                <div class="message-meta">
                    <span id="var-horario"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="decision-container">
        <button onclick="verificarResposta(true)" class="btn-golpe">
            <i class="fa-solid fa-triangle-exclamation"></i> GOLPE!
        </button>
        <button onclick="verificarResposta(false)" class="btn-seguro">
            <i class="fa-solid fa-check"></i> SEGURO
        </button>
    </div>

    <div id="modal-feedback" class="modal hidden">
        <div class="modal-content">
            <div id="modal-icone"></div>
            <h2 id="modal-titulo"></h2>
            <p id="modal-explicacao"></p>
            <button onclick="proximaRodada()" class="btn-continuar">Continuar</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
