<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Quiz Anti-Golpe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-container">
    <div id="tela-inicial" class="screen-overlay">
        <div class="welcome-card">
            <div class="icon-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>Quiz Anti-Golpe</h1>
            <p>Teste suas habilidades contra as fraudes mais comuns do Brasil.</p>
            <button onclick="iniciarJogo()" class="btn-start">Começar Teste</button>
        </div>
    </div>

    <div id="tela-final" class="screen-overlay hidden">
        <div class="welcome-card">
            <div id="resultado-icone" class="icon-shield">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h1 id="resultado-titulo"></h1>
            <p id="resultado-texto"></p>
            <div class="score-display">
                <span id="pontuacao-final">0</span> / <span id="total-final">0</span>
            </div>
            
            <div id="referencias-container" style="text-align: left; width: 100%; margin-bottom: 24px; font-size: 13px; background-color: #f0f2f5; padding: 16px; border-radius: 12px;">
                <p style="font-weight: 700; margin-bottom: 8px; color: #111b21;">Aprofunde seus conhecimentos:</p>
                <ul id="lista-referencias" style="list-style-type: none; display: flex; flex-direction: column; gap: 8px;">
                </ul>
            </div>

            <button onclick="reiniciarJogo()" class="btn-start">Jogar Novamente</button>
        </div>
    </div>

    <div class="chat-header">
        <div class="header-left">
            <i class="fa-solid fa-arrow-left back-arrow"></i>
            <div class="profile-pic">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="chat-details">
                <span id="var-nome" class="chat-title"></span>
                <span id="var-numero" class="chat-subtitle"></span>
            </div>
        </div>
        <div class="header-actions">
            <span id="contador-rodada" class="progress-badge"></span>
            <i class="fa-solid fa-video"></i>
            <i class="fa-solid fa-phone"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </div>

    <div class="chat-messages">
        <div id="var-dia" class="date-divider"></div>

        <div class="message-row">
            <div class="message-bubble">
                <span id="var-conteudo"></span>
                <div class="message-meta">
                    <span id="var-horario"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="decision-container">
        <button onclick="verificarResposta(true)" class="btn-golpe">
            <i class="fa-solid fa-triangle-exclamation"></i> GOLPE!
        </button>
        <button onclick="verificarResposta(false)" class="btn-seguro">
            <i class="fa-solid fa-check"></i> SEGURO
        </button>
    </div>

    <div id="modal-feedback" class="modal hidden">
        <div class="modal-content">
            <div id="modal-icone"></div>
            <h2 id="modal-titulo"></h2>
            <p id="modal-explicacao"></p>
            <button onclick="proximaRodada()" class="btn-continuar">Continuar</button>
        </div>
    </div>

</div>

<script src="banco.js"></script>
<script src="script.js"></script>
</body>
</html>
